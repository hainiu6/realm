<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm 转发管理面板 - 登录</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --ink: #172033;
            --muted: #64748b;
            --line: #dbe3ee;
            --danger: #dc2626;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.2), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(79, 70, 229, 0.12), transparent 30%),
                #f1f5f9;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .login-container {
            width: min(430px, 100%);
            padding: 34px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
            backdrop-filter: blur(12px);
        }
        .brand-mark {
            display: grid;
            width: 52px;
            height: 52px;
            place-items: center;
            margin: 0 auto 17px;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.28);
            font-size: 25px;
            font-weight: 800;
        }
        .eyebrow {
            margin: 0 0 7px;
            color: var(--primary);
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
        }
        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
            line-height: 1.25;
        }
        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }
        .form-group input {
            width: 100%;
            padding: 12px 66px 12px 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            font-size: 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .password-input-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            min-width: 48px;
            padding: 7px 8px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }
        .password-toggle:hover {
            background: #eff6ff;
        }
        button[type="submit"] {
            width: 100%;
            min-height: 46px;
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }
        button[type="submit"]:hover {
            background: var(--primary-dark);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
            transform: translateY(-1px);
        }
        .error-message {
            min-height: 21px;
            margin-top: 13px;
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }
        .loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            margin: 13px auto 0;
            border: 3px solid #dbeafe;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="brand-mark" aria-hidden="true">R</div>
        <p class="eyebrow">REALM CONTROL</p>
        <h1>登录转发管理面板</h1>
        <p class="subtitle">请输入面板密码以继续管理转发服务</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">面板密码</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="请输入密码" 
                        required 
                        autocomplete="current-password"
                        minlength="4"
                    >
                    <button 
                        type="button" 
                        class="password-toggle" 
                        id="togglePassword" 
                        aria-label="切换密码显示"
                    >显示</button>
                </div>
            </div>
            <button type="submit" id="submitButton">登录</button>
            <div class="loading-spinner" id="loadingSpinner"></div>
            <div id="errorMessage" class="error-message" aria-live="polite"></div>
        </form>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('togglePassword');
        const submitButton = document.getElementById('submitButton');
        const errorMessage = document.getElementById('errorMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');

        // 密码显示切换
        toggleButton.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? '显示' : '隐藏';
        });

        // 登录表单提交
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMessage.textContent = '';
            submitButton.disabled = true;
            submitButton.classList.add('loading');
            loadingSpinner.style.display = 'block';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        password: passwordInput.value 
                    }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    throw new Error(data.error || '密码错误');
                }
            } catch (error) {
                errorMessage.textContent = error.message || '登录失败，请重试';
            } finally {
                submitButton.disabled = false;
                submitButton.classList.remove('loading');
                loadingSpinner.style.display = 'none';
            }
        });

        // 页面加载完成后聚焦密码输入框
        window.addEventListener('load', () => {
            passwordInput.focus();
        });

        // 清除之前的错误信息
        passwordInput.addEventListener('input', () => {
            errorMessage.textContent = '';
        });
    </script>
</body>
</html>
