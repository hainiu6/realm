name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release version
        id: release_meta
        shell: bash
        run: |
          version=$(sed -n 's/^panel_ver="\(v[0-9][0-9.]*\)"$/\1/p' realm.sh)
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/}
            publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              echo "Version already tagged; leaving the published release unchanged."
            else
              result=$?
              if [[ "$result" -ne 2 ]]; then exit "$result"; fi
              publish=true
            fi
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum

      - name: Test
        working-directory: web
        run: |
          go test ./...
          go vet ./...

      - name: Verify live Linux traffic counters in an isolated namespace
        working-directory: web
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2
          go test -c -o /tmp/realm-traffic.test .
          sudo env REALM_NFT_TEST=1 unshare --net /tmp/realm-traffic.test -test.run '^TestNFTLive$' -test.v

      - name: Build amd64
        working-directory: web
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o realm_web .
          zip ../realm-panel-linux-amd64.zip \
            realm_web config.toml \
            -r static templates

      - name: Build arm64
        working-directory: web
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" -o realm_web .
          zip ../realm-panel-linux-arm64.zip \
            realm_web config.toml \
            -r static templates

      - name: Create Release
        if: steps.release_meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            realm-panel-linux-amd64.zip
            realm-panel-linux-arm64.zip
            realm.sh
          generate_release_notes: true
